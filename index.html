<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_16');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }

  }

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

// Simplex-style noise helper
vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                        -0.577350269189626, 0.024390243902439);
    vec2 i  = floor(v + dot(v, C.yy) );
    vec2 x0 = v -   i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
        + i.x + vec3(0.0, i1.x, 1.0 ));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m ;
    m = m*m ;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
    vec3 g;
    g.x  = a0.x  * x0.x  + h.x  * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Procedural star with diffraction spikes & soft circular glow
float drawStar(vec2 uv, vec2 pos, float size, float timeOffset) {
    vec2 d = uv - pos;
    float dist = length(d);
    
    // Soft core glow (radial falloff)
    float core = exp(-dist * (60.0 / size));
    
    // 4-point diffraction spike (cross sparkle)
    float spikeH = max(0.0, 1.0 - abs(d.y) * (180.0 / size)) * max(0.0, 1.0 - abs(d.x) * (24.0 / size));
    float spikeV = max(0.0, 1.0 - abs(d.x) * (180.0 / size)) * max(0.0, 1.0 - abs(d.y) * (24.0 / size));
    float spikes = pow(spikeH + spikeV, 1.8) * 0.85;
    
    // Gentle twinkling phase
    float twinkle = 0.5 + 0.5 * sin(u_time * 2.2 + timeOffset * 6.2831);
    
    return (core * 0.75 + spikes * 0.85) * twinkle;
}

void main() {
    vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    // Centered singularity
    float dist = length(p);
    float angle = atan(p.y, p.x);

    // Gravitational lensing distortion
    float distortion = 0.28 / (dist + 0.09);
    float swirl = angle + distortion * 2.2 - u_time * 0.35;
    
    // Procedural silver luminous noise bands using polar coordinates
    float n1 = snoise(vec2(dist * 6.5 - u_time * 0.25, sin(swirl) * 2.5 + cos(swirl) * 1.5));
    float n2 = snoise(vec2(dist * 13.0 + u_time * 0.18, cos(swirl * 2.0) * 2.0));
    float noiseFlow = n1 * 0.6 + n2 * 0.4;
    
    // Event horizon core radius
    float horizonRadius = 0.23;
    float eventHorizon = smoothstep(horizonRadius - 0.015, horizonRadius + 0.03, dist);
    
    // Outer accretion glow / halo
    float diskInner = smoothstep(horizonRadius, horizonRadius + 0.12, dist);
    float diskOuter = exp(-dist * 2.6);
    float accretionIntensity = diskInner * diskOuter * (0.85 + 0.65 * noiseFlow);
    
    // Smooth spiral streams flowing into the black hole
    float spiralArms = pow(max(0.0, sin(swirl * 3.0 - dist * 10.0)), 3.5) * exp(-dist * 1.6) * 0.35;

    // Subtle, balanced silver intensity
    float totalSilverGlow = accretionIntensity * 1.05 + spiralArms * 0.75;
    
    // Sophisticated metallic silver / obsidian chrome color grading
    vec3 deepSpace = vec3(0.005, 0.006, 0.01);
    vec3 darkGraphite = vec3(0.12, 0.13, 0.16);
    vec3 silverMid = vec3(0.55, 0.58, 0.65);
    vec3 chromeHighlight = vec3(0.85, 0.88, 0.93);
    
    // Inner black void of event horizon
    vec3 color = mix(vec3(0.0), deepSpace, eventHorizon);
    
    // Toned, subtle silver luminescence on the accretion disk
    vec3 silverGrad = mix(darkGraphite, silverMid, smoothstep(0.05, 0.55, totalSilverGlow));
    silverGrad = mix(silverGrad, chromeHighlight, smoothstep(0.55, 1.1, totalSilverGlow));
    color += silverGrad * totalSilverGlow * eventHorizon;
    
    // --- REALISTIC COSMIC STARFIELD (Replacing square blinking dots with star shapes) ---
    // Cellular grid for distinct stellar bodies with diffraction cross spikes and soft halos
    vec2 starCoord = p * 16.0;
    vec2 i_star = floor(starCoord);
    vec2 f_star = fract(starCoord) - 0.5;
    
    float starsAccum = 0.0;
    for (int y = -1; y <= 1; y++) {
        for (int x = -1; x <= 1; x++) {
            vec2 neighbor = vec2(float(x), float(y));
            vec2 cellId = i_star + neighbor;
            float rand1 = fract(sin(dot(cellId, vec2(12.9898, 78.233))) * 43758.5453);
            float rand2 = fract(sin(dot(cellId, vec2(93.9898, 67.345))) * 24634.6345);

            if (rand1 > 0.76) {
                vec2 starOffset = neighbor + (vec2(rand1, rand2) - 0.5) * 0.7;
                vec2 starPosUV = (cellId + vec2(0.5) + (vec2(rand1, rand2) - 0.5) * 0.7) / 16.0;
                float starDistFromCenter = length(starPosUV);

                if (starDistFromCenter > horizonRadius + 0.04) {
                    float starSize = 0.35 + rand2 * 0.65;
                    float starIntensity = drawStar(starCoord, cellId + starOffset - neighbor + 0.5, starSize, rand1);
                    starsAccum += starIntensity * smoothstep(horizonRadius + 0.04, horizonRadius + 0.22, starDistFromCenter);
                }
            }
        }
    }
    
    // Add glowing stellar sparkle in platinum/pure white
    vec3 starColor = vec3(0.92, 0.95, 1.0);
    color += starColor * starsAccum * 0.85;
    
    // Smooth peripheral vignette
    float vignette = smoothstep(1.35, 0.3, length(p));
    color *= vignette;
    
    gl_FragColor = vec4(color, 1.0);

  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');

  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {

      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;

    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
